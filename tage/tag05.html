<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Adventskalender Tag 5 – Sudoku</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root{
      --bg-image: url('assets/lock.png');
      --glass-opacity: 0.28;
      --glass-blur: 14px;
      --card-max-width: 900px;
      --accent: #1d9e57;
    }

    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg-image) no-repeat center center fixed;
      background-size: cover;
      background-position: center -30px;
      color: #222;
    }

    /* ===== Header ===== */
    header{
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
      padding: 1rem 1rem .5rem;
    }
    header h1{ 
      margin: .2rem 0 1rem;
      font-size: 2.4rem;
    }

    /* ===== Hauptcontainer ===== */
    main.puzzle-container{
      background: transparent !important;
      box-shadow: none !important;
      border: 0 !important;
      border-radius: 0 !important;
      padding: 0 !important;
      max-width: var(--card-max-width);
      margin: 520px auto 3rem;
    }

    /* ===== Glas-Karte ===== */
    .glass-card{
      background: rgba(255,255,255,var(--glass-opacity));
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      border: 1px solid rgba(0,0,0,.08);
      padding: 1.25rem;
      margin: 0 1rem;
    }

    /* ===== Sudoku ===== */
    .sudoku{
      width: min(92vw, 520px);
      aspect-ratio: 1/1;
      margin: .75rem auto 0;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      border: 4px solid #000;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
    }

    .cell{ border: 1px solid #000; position: relative; }
    .cell[data-c="0"], .cell[data-c="3"], .cell[data-c="6"] { border-left-width: 3px; }
    .cell[data-r="0"], .cell[data-r="3"], .cell[data-r="6"] { border-top-width: 3px; }
    .cell[data-c="8"] { border-right-width: 3px; }
    .cell[data-r="8"] { border-bottom-width: 3px; }

    /* ===== Zentrierte Zahlen ===== */
    .prefilled,
    .cell input {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 1.2rem/1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      background: transparent;
      border: none;
      outline: none;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }

    .cell input:focus {
      outline: 3px solid #000;
      outline-offset: 0;
      box-shadow: none;
    }

    .error{ background: rgba(255,0,0,.16)!important; }
    .ok{ background: rgba(30,200,0,.12)!important; }

    /* ===== Buttons ===== */
    .actions{
      display: flex; justify-content: center; align-items: center;
      gap: .75rem; margin-top: .9rem;
    }
    .btn{
      appearance: none; border: none; cursor: pointer;
      background: var(--accent); color:#fff;
      padding: .6rem 1rem; border-radius: 10px;
      font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,.2);
    }
    #sudokuMsg{ color:#222; }

    /* ===== Buchstabenanzeige ===== */
    .letter-container{ margin-top: 1rem; text-align: center; }
    .letter{
      display:inline-block; min-width:2.5rem;
      padding:.4rem .8rem; font-weight:800; font-size:1.2rem;
      background:#fff; color:#111; border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
    }

    /* ===== Schloss Animation ===== */
    .lock-container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 9999;
    }
    .lock-container.show {
      opacity: 1;
      pointer-events: all;
    }

    .lock {
      position: relative;
      width: 150px;
      height: 180px;
      background: #f4c542;
      border-radius: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      transform-origin: center bottom;
      animation: unlock 2s ease forwards;
    }

    .lock::before {
      content: "";
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border: 14px solid #f4c542;
      border-bottom: none;
      border-radius: 50px 50px 0 0;
      background: transparent;
      transition: transform 1s ease;
    }

    @keyframes unlock {
      0%   { transform: rotate(0deg) scale(1); }
      40%  { transform: rotate(-20deg) scale(1.05); }
      70%  { transform: rotate(10deg) scale(1.05); }
      100% { transform: rotate(0deg) scale(1); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tag&nbsp;5 – Sudoku</h1>
  </header>

  <main class="puzzle-container">
    <div class="glass-card">
      <p>In der Hektik haben die Elfen leider den Schlüssel zur Geschenkefabrik verloren und das gerade so kurz vor Weihnachten. Kannst du das Sudoku lösen, damit die Produktion weiterlaufen kann?</p>

      <div id="sudoku" class="sudoku"></div>

      <div class="actions">
        <button type="button" class="btn" onclick="checkSudoku()">Überprüfen</button>
        <span id="sudokuMsg"></span>
      </div>

      <div id="letter-container" class="letter-container" style="display:none;">
        <p>Dein Buchstabe:</p>
        <div class="letter" id="letter"></div>
        <p>Merke dir diesen Buchstaben!</p>
      </div>
    </div>
  </main>

  <!-- Schloss Overlay -->
  <div id="lockEffect" class="lock-container">
    <div class="lock"></div>
  </div>

  <script>
    /* ===== Puzzle ===== */
    const puzzle = [
      [0,0,7,0,0,9,0,3,0],
      [0,6,8,0,0,0,9,2,0],
      [0,0,3,0,0,2,1,0,8],
      [0,7,0,9,0,0,2,4,0],
      [3,0,0,0,0,5,0,0,0],
      [5,9,0,0,0,7,0,0,0],
      [0,0,0,0,2,0,0,9,0],
      [8,0,0,0,5,0,4,0,0],
      [0,0,1,0,0,4,6,0,0],
    ];

    const root = document.getElementById('sudoku');
    const inputs = [];
    for (let r=0;r<9;r++){
      inputs[r]=[];
      for (let c=0;c<9;c++){
        const cell=document.createElement('div');
        cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
        if (puzzle[r][c]!==0){
          const s=document.createElement('div');
          s.className='prefilled'; s.textContent=puzzle[r][c];
          cell.appendChild(s); inputs[r][c]=null;
        } else {
          const inp=document.createElement('input');
          inp.inputMode='numeric'; inp.maxLength=1;
          inp.addEventListener('input',(e)=>{
            const v=e.target.value.replace(/[^1-9]/g,'');
            e.target.value=v.slice(0,1);
          });
          cell.appendChild(inp); inputs[r][c]=inp;
        }
        root.appendChild(cell);
      }
    }

    function solve(grid){
      const findEmpty=()=>{for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(grid[r][c]===0)return[r,c];return null;};
      const isSafe=(r,c,val)=>{
        for(let i=0;i<9;i++) if(grid[r][i]===val||grid[i][c]===val) return false;
        const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
        for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(grid[br+i][bc+j]===val) return false;
        return true;
      };
      const step=()=>{
        const pos=findEmpty(); if(!pos) return true;
        const [r,c]=pos;
        for(let v=1;v<=9;v++){
          if(isSafe(r,c,v)){ grid[r][c]=v; if(step()) return true; grid[r][c]=0; }
        }
        return false;
      };
      return step();
    }

    function readUserGrid(){
      const g=puzzle.map(row=>row.slice());
      for(let r=0;r<9;r++) for(let c=0;c<9;c++){
        if(puzzle[r][c]===0){
          const v=inputs[r][c].value?parseInt(inputs[r][c].value,10):0;
          g[r][c]=v;
        }
      }
      return g;
    }

    function checkSudoku(){
      const solution=puzzle.map(row=>row.slice());
      if(!solve(solution)){
        document.getElementById('sudokuMsg').textContent='Dieses Sudoku ist nicht lösbar.';
        return;
      }
      const user=readUserGrid();
      let allFilled=true, allCorrect=true;

      for(let r=0;r<9;r++) for(let c=0;c<9;c++){
        const cellDiv=root.children[r*9+c];
        cellDiv.classList.remove('error','ok');
        if(puzzle[r][c]===0){
          const val=user[r][c];
          if(val===0) allFilled=false;
          if(val!==0 && val!==solution[r][c]){ allCorrect=false; cellDiv.classList.add('error'); }
          else if(val!==0){ cellDiv.classList.add('ok'); }
        }
      }

      const msg=document.getElementById('sudokuMsg');
      if(allCorrect && allFilled){
        msg.style.color='green'; msg.textContent='🎉 Juhuuu die Geschenkeproduktion kann weitergehen!';
        showLetter('n');
        openLockEffect();
      } else if(!allFilled){
        msg.style.color='#222'; msg.textContent='Es sind noch Felder leer – weiterknobeln 😊';
      } else {
        msg.style.color='crimson'; msg.textContent='Da ist noch etwas falsch. Fehler sind rot markiert.';
      }
    }

    function showLetter(letter){
      const container=document.getElementById('letter-container');
      document.getElementById('letter').textContent=letter;
      container.style.display='block';
    }

    function openLockEffect(){
      const overlay = document.getElementById('lockEffect');
      overlay.classList.add('show');
      setTimeout(()=>overlay.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
