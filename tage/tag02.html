    overflow-x:hidden;
  }
 .hit {
  background: transparent; /* kein Hintergrund */
  border: none;            /* keine Umrandung */
  opacity: 0;              /* komplett unsichtbar */
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  width: 3.2%;
  height: 6.2%;
  cursor: pointer;
}
}
  /* ---------------------- Hintergrund & Sterne ---------------------- */
  .starfield, .meteors { pointer-events:none; position:fixed; inset:0; z-index:0; }
  .starfield::before, .starfield::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.9) 99%, transparent 100%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,.8) 99%, transparent 100%),
      radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,.7) 99%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.7) 99%, transparent 100%),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,.8) 99%, transparent 100%),
      radial-gradient(1px 1px at 15% 65%, rgba(255,255,255,.6) 99%, transparent 100%);
    opacity:.7;
  }

  /* ---------------------- Sternschnuppen ---------------------- */
  .meteors span{
    position:absolute;
    top:-10vh; left:-10vw;
    width:2px; height:2px;
    background:#fff; border-radius:50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,.8);
    transform: rotate(15deg);
    opacity:0;
    animation: meteorFly linear infinite;
  }

  .meteors span::after{
    content:"";
    position:absolute;
    top:-1px; left:-180px;
    height:2px; width:180px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9));
    border-radius:2px;
  }

  /* realistischer Flug mit sanftem Ein- und Ausblenden */
  @keyframes meteorFly {
    0% { opacity: 0; transform: translate(0,0) rotate(15deg); }
    5% { opacity: 1; }
    50% { opacity: 1; }
    90% { opacity: 0.6; }
    100% { 
      opacity: 0;
      transform: translate(120vw, 30vh) rotate(15deg);
    }
  }

  header{ position:relative; z-index:1; text-align:center; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); padding:1.2rem 1rem .4rem; }
  h1{ margin:0; }

  .page{ position:relative; z-index:1; max-width:1050px; margin:1rem auto 2rem; padding:1rem; }
  .card{
    background:rgba(255,255,255,.92); backdrop-filter: blur(4px);
    border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.15);
    padding:1rem;
  }
  .msg{ margin:.6rem 0 1rem; font-weight:700; color:#ef4444; min-height:1.2em; }

  .scene{
    position:relative;
    border-radius:12px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.18);
    background:#f8f5ea;
  }
  .scene img{ display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }

  .hit{
    position:absolute; border-radius:50%;
    transform: translate(-50%, -50%);
    width:3%; height:10%;
    cursor:pointer;
  }
  .decoy{ width:2.8%; height:5.4%; }
  .debug .hit{ outline:2px dashed rgba(255,0,0,.6); }
  .debug .decoy{ outline:2px dashed rgba(0,128,255,.6); }

  .sticker{
    position:absolute; transform: translate(-50%, -50%);
    font-size: clamp(16px, 2.2vw, 28px);
    pointer-events:none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));

<script>
  /* 🌠 Dynamisch generierte Sternschnuppen für mehr Natürlichkeit */
  const meteorContainer = document.querySelector('.meteors');

  function createMeteor() {
    const m = document.createElement('span');
    const startTop = Math.random() * 80; // Start-Höhe 0–80%
    const startLeft = -10 - Math.random() * 20; // leicht außerhalb des Bilds
    const duration = 4 + Math.random() * 4; // 4–8 Sekunden
    const delay = Math.random() * 6; // Startverzögerung
    const angle = 10 + Math.random() * 10; // 10–20°
    const scale = 0.8 + Math.random() * 1.2; // Größe leicht unterschiedlich

    m.style.top = `${startTop}vh`;
    m.style.left = `${startLeft}vw`;
    m.style.animationDuration = `${duration}s`;
    m.style.animationDelay = `${delay}s`;
    m.style.transform = `rotate(${angle}deg) scale(${scale})`;

    meteorContainer.appendChild(m);
  }

  // 10 Sternschnuppen mit zufälligen Eigenschaften erzeugen
  for (let i = 0; i < 10; i++) createMeteor();

  // Feedback-Logik
  const msg = document.getElementById('feedback');
  const santa = document.getElementById('santa');
  const decoys = document.querySelectorAll('.decoy');

  santa.addEventListener('click', () => {
    msg.style.color = '#16a34a';
    msg.textContent = 'Juhuuu! Du hast den Weihnachtsmann gefunden 🎅 Hoffentlich entwischt er uns nicht nochmal. Für deine Mühe bekommst du den Buchstaben "h"';
    // 🎉 Konfetti-Effekt
const confettiContainer = document.createElement('div');
confettiContainer.style.position = 'fixed';
confettiContainer.style.inset = '0';
confettiContainer.style.overflow = 'hidden';
confettiContainer.style.pointerEvents = 'none';
confettiContainer.style.zIndex = '9999';
document.body.appendChild(confettiContainer);

for (let i = 0; i < 100; i++) {
  const piece = document.createElement('div');
  piece.style.position = 'absolute';
  piece.style.top = '-10px';
  piece.style.left = Math.random() * 100 + 'vw';
  piece.style.width = '8px';
  piece.style.height = '12px';
  piece.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
  piece.style.opacity = Math.random();
  piece.style.transform = `rotate(${Math.random() * 360}deg)`;
  piece.style.animation = `fall ${3 + Math.random() * 3}s linear forwards`;
  confettiContainer.appendChild(piece);
}

const style = document.createElement('style');
style.textContent = `
@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0.8;
  }
}`;
document.head.appendChild(style);

// Entferne Konfetti nach 5 Sekunden
setTimeout(() => confettiContainer.remove(), 5000);
  });

    msg.textContent = 'Bitte mal die Brille putzen. Das war doch nicht der Weihnachtsmann 🙅🏻‍♂️ Versuch es nochmal.';
